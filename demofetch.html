<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo fetch</title>
    <style>
        table{
            width: 80vw;
            border-collapse: collapse;
            margin: auto;
        }
        th,td{
            border: 2px solid red;
            text-align: center;
        }
    </style>
    <script>
        let rate=0;
        async function loadProducts(){
            const URL="https://dummyjson.com/products?limit=60&skip=5";
            try{
                const res=await fetch(URL);
                console.log("res=",res);
                const data=await res.json();
                console.log("data=",data.products);
                let rows="";
                data.products.map((i,index)=>(
                  rows=rows+`
                    <tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src=${i.images[0]} width=50 height=50/></td>
                        <td>${i.category}</td>
                        <td>${i.rating}</td>
                        <td>${(i.price*rate).toFixed(2)}₹</td>
                        <td>${i.stock}</td>
                        <td><button>AddToCart</button></td>
                        </tr> `
                ))
                const el=document.getElementById("data");
                el.innerHTML=rows;

            }
            catch(err){
                console.log("Error",err);
            }
        }
        async function getRate(){
            const URL="https://open.er-api.com/v6/latest/USD";
            try{
                const res=await fetch(URL);
                const rate=await res.json();
                console.log("INRrate=",rate.rates.INR);
                return rate.rates.INR;
            }
            catch(err){
                console.log("Error=",err)
            }
        }
        const test=async()=>{
        rate=await getRate();
        console.log("rate=",rate);
        }
        test();
        loadProducts();
    </script>
</head>
<body>
  <h1>
    <center>List Of Products</center></h1>
    <table>
        <thead>
            <tr>
                <th>Sr.No.</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Price($)</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>  
</body>
</html>
